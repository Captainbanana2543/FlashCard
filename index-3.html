<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .flashcard-container {
            perspective: 1000px;
        }
        .flashcard-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }
        .flashcard-front, .flashcard-back {
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .flashcard-front {
            background-color: white;
        }
        .flashcard-back {
            background-color: #f3f4f6;
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-8">
    <div class="max-w-2xl mx-auto px-4">
        <h1 class="text-3xl font-bold text-center text-indigo-600 mb-8">My Flashcards</h1>
        
        <!-- Add Card Form -->
        <div class="bg-white p-6 rounded-xl shadow-sm mb-8 border border-gray-100">
            <h2 class="text-lg font-semibold mb-4">Add New Card</h2>
            <div class="flex flex-col sm:flex-row gap-4">
                <input type="text" id="front-input" placeholder="Front (e.g. Question)" class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <input type="text" id="back-input" placeholder="Back (e.g. Answer)" class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="addCard()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">Add</button>
            </div>
        </div>

        <!-- Flashcard Display -->
        <div id="flashcard-section" class="hidden">
            <div class="flashcard-container w-full h-64 sm:h-80 mb-6 cursor-pointer group" onclick="toggleFlip()">
                <div id="current-card" class="flashcard w-full h-full">
                    <div class="flashcard-inner">
                        <div class="flashcard-front">
                            <p id="card-front-text" class="text-2xl sm:text-3xl font-medium text-center text-gray-800"></p>
                        </div>
                        <div class="flashcard-back border-2 border-indigo-100">
                            <p id="card-back-text" class="text-xl sm:text-2xl text-center text-indigo-900"></p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <button onclick="prevCard()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">Previous</button>
                <span id="card-counter" class="text-gray-500 font-medium">1 / 1</span>
                <button onclick="nextCard()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">Next</button>
            </div>
            <div class="mt-4 text-center">
                <button onclick="deleteCard()" class="text-sm text-red-500 hover:text-red-700">Delete Current Card</button>
            </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-12">
            <p class="text-gray-500">No flashcards yet. Add some above to start studying!</p>
        </div>
    </div>

    <script>
        let cards = JSON.parse(localStorage.getItem('flashcards')) || [];
        let currentIndex = 0;
        const flashcardElement = document.getElementById('current-card');

        function saveCards() {
            localStorage.setItem('flashcards', JSON.stringify(cards));
        }

        function updateUI() {
            const flashcardSection = document.getElementById('flashcard-section');
            const emptyState = document.getElementById('empty-state');
            
            if (cards.length === 0) {
                flashcardSection.classList.add('hidden');
                emptyState.classList.remove('hidden');
            } else {
                flashcardSection.classList.remove('hidden');
                emptyState.classList.add('hidden');
                
                flashcardElement.classList.remove('flipped');
                
                setTimeout(() => {
                    document.getElementById('card-front-text').textContent = cards[currentIndex].front;
                    document.getElementById('card-back-text').textContent = cards[currentIndex].back;
                    document.getElementById('card-counter').textContent = `${currentIndex + 1} / ${cards.length}`;
                }, 150);
            }
        }

        function addCard() {
            const frontInput = document.getElementById('front-input');
            const backInput = document.getElementById('back-input');
            const frontText = frontInput.value.trim();
            const backText = backInput.value.trim();

            if (frontText && backText) {
                cards.push({ front: frontText, back: backText });
                saveCards();
                frontInput.value = '';
                backInput.value = '';
                currentIndex = cards.length - 1; 
                updateUI();
            } else {
                alert('Please enter both front and back text.');
            }
        }

        function toggleFlip() {
            if (cards.length > 0) {
                flashcardElement.classList.toggle('flipped');
            }
        }

        function nextCard() {
            if (cards.length > 0) {
                currentIndex = (currentIndex + 1) % cards.length;
                updateUI();
            }
        }

        function prevCard() {
            if (cards.length > 0) {
                currentIndex = (currentIndex - 1 + cards.length) % cards.length;
                updateUI();
            }
        }
        
        function deleteCard() {
            if (cards.length > 0 && confirm('Are you sure you want to delete this card?')) {
                cards.splice(currentIndex, 1);
                saveCards();
                if (currentIndex >= cards.length && currentIndex > 0) {
                    currentIndex--;
                }
                updateUI();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (cards.length === 0) return;
            if (document.activeElement.tagName === 'INPUT') return;
            
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
                e.preventDefault();
                toggleFlip();
            } else if (e.code === 'ArrowRight') {
                nextCard();
            } else if (e.code === 'ArrowLeft') {
                prevCard();
            }
        });

        updateUI();
    </script>
</body>
</html>
